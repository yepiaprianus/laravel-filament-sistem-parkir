<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e1b4b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Wireless / Smart Sensor Signal Arcs -->
  <path d="M78 30 C88 40, 88 56, 78 66" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35" />
  <path d="M84 24 C97 37, 97 61, 84 72" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.2" />

  <!-- Parking Letter "P" -->
  <path d="M38 32 L62 32 C72 32, 78 37, 78 47 C78 57, 72 62, 62 62 L50 62 L50 88 L38 88 Z" fill="#ffffff" />
  <path d="M50 42 L61 42 C65 42, 67 44, 67 47 C67 50, 65 52, 61 52 L50 52 Z" fill="#3b82f6" />

  <!-- "E" symbol / Smart Electric Flash Badge -->
  <g transform="translate(66, 64)">
    <circle cx="16" cy="16" r="16" fill="#ffffff" filter="url(#shadow)" />
    <!-- Lightning / E-Parking Spark -->
    <path d="M18 5 L9 17 L15 17 L13 27 L24 15 L17 15 Z" fill="url(#accentGrad)" />
  </g>
</svg>